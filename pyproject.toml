[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "omnistack-rs"
version = "0.1.0"
description = "Federated Personalization Engine: Master LLM + Shadow LoRA at 12.8x VRAM reduction"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "triton>=3.0.0",
    "transformers>=4.40",
    "peft>=0.10",
    "modal>=0.64",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "accelerate>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark",
]
mlperf = [
    "mlcommons-loadgen>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnistack_rs*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
